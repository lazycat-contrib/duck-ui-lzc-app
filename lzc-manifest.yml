application:
  subdomain: duck-ui
  background_task: false
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://duck-ui:5522/
services:
  duck-ui:
    # upstream: ghcr.io/caioricciuti/duck-ui:2.4.0
    image: registry.lazycat.cloud/czyt/caioricciuti/duck-ui:635c774e8f22c06d
    environment:
      - DUCK_UI_PORT=5522
