version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/duck-ui.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: duck-ui

build:
  run_buildscript: false

images:
  # 主应用：上游有完整三段 SemVer tag（最新 1.2.1），排除 latest/sha-*/.sig 等
  - id: duck-ui
    target: service
    service: duck-ui
    source: ghcr.io/caioricciuti/duck-ui
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Duck-UI
    summary: "DuckDB的Web交互工具"
